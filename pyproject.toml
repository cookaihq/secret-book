# secret-book 运行时环境（ADR 0007 §1.1/§1.2）。
# 本 skill 零第三方依赖，这份文件的作用是让 uv 钉死**解释器版本**：脚本用了
# str.removesuffix（3.9+），系统 python3 更老时会在运行期才炸。
# 重建环境：uv sync --project <本目录> --no-dev（venv 落 <本目录>/.venv，
# ADR 0007 §1.3；--no-dev 见 §1.2 补充 2——重建的是运行环境，不带测试依赖）。
# 解释器版本由同目录 .python-version 钉死（3.13）：requires-python 只给下限，
# 不同机器会各自选中不同解释器（本机 3.13、只有系统 3.9 的机器则 3.9），
# 正是 ADR 0007 要消除的分叉。
# lark-cli 是系统级外部程序，不由 uv 管理（缺失时脚本报错给安装指引）。
[project]
name = "secret-book"
version = "2.0.0"
description = "令牌管理 CLI（飞书多维表格后端）的运行时环境锁定"
requires-python = ">=3.9"
dependencies = []

[dependency-groups]
dev = ["pytest>=8,<9"]

[tool.uv]
# 脚本直接运行，不作为可安装包构建。
package = false
